<!DOCTYPE HTML>
<html>
<head>
	<title>Photography | Anya Sinha</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/main.css">

	<style>
		*, body, p, li, a { font-family: 'Inter', sans-serif !important; color: #000 !important; }
		h1, h2 { font-family: 'Cormorant Garamond', serif !important; font-weight: 700 !important; }
		p, li { line-height: 1.8 !important; }

		body {
			background: linear-gradient(to bottom, #f6e7ff 0%, #eaf5ff 28%, #fff7e7 52%, #fff 83%, #fff 100%);
		}

		.page-wrap {
			max-width: 900px;
			margin: 0 auto;
			padding: 80px 30px 100px;
		}

		.back-link {
			display: inline-block;
			margin-bottom: 40px;
			margin-right: 24px;
			font-weight: 600;
			text-decoration: none !important;
			border-bottom: 2px solid #000;
		}

		h1 { font-size: 2.8em; margin-bottom: 0.2em; }
		.page-intro { font-size: 1.2em; font-weight: 400 !important; margin-bottom: 2em; }

		.gallery-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 20px;
			margin: 2em 0;
		}

		.gallery-item {
			border-radius: 8px;
			overflow: hidden;
			background: rgba(255, 255, 255, 0.6);
		}

		.gallery-item img {
			width: 100%;
			height: 220px;
			object-fit: cover;
			display: block;
			cursor: zoom-in;
		}

		.coming-soon {
			margin-top: 3em;
			padding: 24px;
			border: 1px dashed rgba(0,0,0,0.3);
			border-radius: 8px;
			text-align: center;
			font-style: italic;
		}
	</style>
</head>
<body>
	<div class="page-wrap">
		<a href="creatives-portfolio.html" class="back-link">&larr; Back to Creatives Portfolio</a>
		<a href="index.html#interests" class="back-link">&larr; Back to Beyond the Metrics</a>

		<h1>Photography</h1>
		<p class="page-intro">A handful of moments I've caught along the way, mostly candid, mostly unplanned.</p>

		<!-- Drop photos into /images/ and add <div class="gallery-item"><img src="images/your-photo.jpg"></div> blocks below. -->
		<div class="gallery-grid">
			<div class="gallery-item">
				<img src="images/photo-1.jpg" alt="Photography 1" onerror="this.parentElement.style.display='none'">
			</div>
			<div class="gallery-item">
				<img src="images/photo-2.jpg" alt="Photography 2" onerror="this.parentElement.style.display='none'">
			</div>
			<div class="gallery-item">
				<img src="images/photo-3.jpg" alt="Photography 3" onerror="this.parentElement.style.display='none'">
			</div>
		</div>

		<div class="coming-soon">More photos coming soon — check back for updates.</div>
	</div>
</body>
</html>
