<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Door Portal Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Quicksand:wght@400;500&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ffd9ec 0%, #ffc2dd 30%, #f3b6e8 55%, #d9b8f0 80%, #c9c3f5 100%);
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 640px;
    max-width: 92vw;
    padding: 60px 40px 50px;
  }

  .title {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 2.2em;
    color: #6b3a5e;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    text-align: center;
    color: #8a5a80;
    font-size: 1em;
    margin: 0 0 40px;
  }

  .archway {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    height: 340px;
    border-radius: 200px 200px 14px 14px;
    background: linear-gradient(180deg, #f7c9e0 0%, #e8a0c8 100%);
    padding: 14px;
    box-shadow: 0 30px 60px rgba(150, 60, 120, 0.28);
  }

  .glow {
    position: absolute;
    inset: 14px;
    border-radius: 190px 190px 6px 6px;
    background: radial-gradient(ellipse at 50% 30%, #fff3fa 0%, #ffd3ec 35%, #eaa8d6 70%, transparent 100%);
    opacity: 0;
    transition: opacity 1.1s ease;
    z-index: 1;
  }

  .archway.open .glow { opacity: 0.9; }

  .doors {
    position: absolute;
    inset: 14px;
    border-radius: 190px 190px 6px 6px;
    overflow: hidden;
    display: flex;
    perspective: 900px;
    z-index: 2;
  }

  .door {
    position: relative;
    width: 50%;
    height: 100%;
    background: linear-gradient(180deg, #f0a8c6 0%, #d97fae 100%);
    transition: transform 1.3s cubic-bezier(0.6, -0.1, 0.3, 1);
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .door::before {
    content: '';
    position: absolute;
    inset: 18px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 4px;
  }

  .door-left { transform-origin: left center; border-right: 1px solid rgba(150, 60, 110, 0.3); }
  .door-right { transform-origin: right center; border-left: 1px solid rgba(150, 60, 110, 0.3); }

  .door-left.opened { transform: rotateY(-112deg); }
  .door-right.opened { transform: rotateY(112deg); }

  .knob {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff3fa;
    box-shadow: 0 0 6px #fff3fa;
    transform: translateY(-50%);
  }

  .door-left .knob { right: 14px; }
  .door-right .knob { left: 14px; }

  .scene {
    position: absolute;
    inset: 14px;
    border-radius: 190px 190px 6px 6px;
    background: radial-gradient(ellipse at 50% 20%, #fff8fb 0%, #ffe3f2 40%, #f2bede 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    z-index: 0;
  }

  .scene p {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.3em;
    color: #7a3f66;
    margin: 0;
    max-width: 280px;
  }

  .butterfly {
    position: absolute;
    width: 22px;
    height: 18px;
    z-index: 3;
    animation: fly 9s ease-in-out infinite;
    opacity: 0;
  }

  .butterfly .wing {
    position: absolute;
    top: 0;
    width: 11px;
    height: 16px;
    border-radius: 60% 60% 60% 5%;
    animation: flap 0.35s ease-in-out infinite alternate;
  }

  .butterfly .wing.left {
    left: 0;
    transform-origin: right center;
    background: linear-gradient(135deg, #ffb6d9, #d874ae);
  }

  .butterfly .wing.right {
    right: 0;
    border-radius: 60% 60% 5% 60%;
    transform-origin: left center;
    background: linear-gradient(225deg, #f0a0d0, #c862a0);
  }

  .butterfly.b2 .wing.left { background: linear-gradient(135deg, #e6b8ff, #b878e0); }
  .butterfly.b2 .wing.right { background: linear-gradient(225deg, #dca8f5, #a866d4); }

  .butterfly.b3 .wing.left { background: linear-gradient(135deg, #fff0b8, #f5c96e); }
  .butterfly.b3 .wing.right { background: linear-gradient(225deg, #ffe6a0, #eeb85a); }

  @keyframes flap {
    from { transform: scaleX(1); }
    to { transform: scaleX(0.35); }
  }

  @keyframes fly {
    0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
    10% { opacity: 1; }
    30% { transform: translate(60px, -40px) rotate(8deg); }
    50% { transform: translate(20px, -90px) rotate(-6deg); }
    70% { transform: translate(-50px, -60px) rotate(10deg); }
    90% { opacity: 1; }
    100% { opacity: 0; transform: translate(-20px, -130px) rotate(-4deg); }
  }

  .hint {
    text-align: center;
    margin-top: 26px;
    color: #9a5f8c;
    font-size: 0.85em;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

  <div class="stage">
    <p class="title">Pursuing a double degree</p>
    <p class="subtitle">tap a door to step inside</p>

    <div class="archway" id="archway">
      <div class="scene">
        <p>Two schools, one story &mdash; welcome to the next chapter.</p>
      </div>
      <div class="glow"></div>
      <div class="doors">
        <div class="door door-left" id="doorLeft">
          <div class="knob"></div>
        </div>
        <div class="door door-right" id="doorRight">
          <div class="knob"></div>
        </div>
      </div>
      <div class="butterfly" style="left: 15%; top: 55%; animation-delay: 0.5s;">
        <div class="wing left"></div><div class="wing right"></div>
      </div>
      <div class="butterfly b2" style="left: 75%; top: 60%; animation-delay: 3s;">
        <div class="wing left"></div><div class="wing right"></div>
      </div>
      <div class="butterfly b3" style="left: 45%; top: 70%; animation-delay: 5.5s;">
        <div class="wing left"></div><div class="wing right"></div>
      </div>
    </div>

    <p class="hint">click either door — it swings open on its hinge</p>
  </div>

<script>
  const doorLeft = document.getElementById('doorLeft');
  const doorRight = document.getElementById('doorRight');
  const archway = document.getElementById('archway');

  function openDoors() {
    doorLeft.classList.add('opened');
    doorRight.classList.add('opened');
    archway.classList.add('open');
  }

  doorLeft.addEventListener('click', openDoors);
  doorRight.addEventListener('click', openDoors);
</script>

</body>
</html>
